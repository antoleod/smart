name: Import verified SmartAssignment v2.0.4 build
on:
  push:
    paths: [".github/workflows/import-smart-release-2.0.4.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified build-only artifact
        env:
          RELEASE_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-30f0-81f4-97e3-673ee5432ff8/raw?se=2026-11-18T12%3A20%3A37Z&sp=r&sv=2026-06-06&sr=b&scid=0be89b80-0471-5d7f-8d5e-764d743bb943&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A27%3A37Z&ske=2026-11-19T09%3A27%3A37Z&sks=b&skv=2026-06-06&sig=iVzV73Tp3qaKS4e2cHrGEuo5fR2IZtao4nkOjEZoRv8%3D"
        run: |
          curl --fail --silent --show-error --location --retry 2 "$RELEASE_ARTIFACT_URL" -o /tmp/smart-2.0.4.zip
          echo "529f296b464b0bb1e26d795da2fa64da11db2b3db17db3e4a2df4cbf629f1b49  /tmp/smart-2.0.4.zip" | sha256sum -c -
          mkdir -p /tmp/smart-release
          unzip -q /tmp/smart-2.0.4.zip -d /tmp/smart-release
          test "$(find /tmp/smart-release -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(node -p "require('/tmp/smart-release/build-meta.json').version")" = "2.0.4"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').releaseTag")" = "v2.0.4"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').sourceCommit")" = "bccf45c379af137eb7acd4d4797c283759ce97d2"
      - name: Publish only compiled runtime files
        run: |
          for file in smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md; do
            test -s "/tmp/smart-release/$file"
            cp "/tmp/smart-release/$file" "./$file"
          done
          git config user.name "SmartAssignment Build Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md
          git commit -m "release: SmartAssignment 2.0.4 verified runtime only"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin refs/tags/v2.0.4 >/dev/null; then
            git tag -a v2.0.4 -m "SmartAssignment 2.0.4 validated build"
            git push origin refs/tags/v2.0.4
          fi
