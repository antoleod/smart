name: Import verified SmartAssignment v2.0.3 build
on:
  push:
    paths: [".github/workflows/import-smart-release-2.0.3.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified build-only artifact
        env:
          RELEASE_ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b378-8210-9ff8-01b4d330a5d3/raw?se=2026-11-18T11%3A41%3A22Z&sp=r&sv=2026-06-06&sr=b&scid=6cecf8ed-0348-529e-87a9-9330d777820e&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A48%3A17Z&ske=2026-11-19T09%3A48%3A17Z&sks=b&skv=2026-06-06&sig=2pEoxwTUWGUnnqma20aFvp4VY01DkZSXM/2czzkTnf0%3D"
        run: |
          curl --fail --silent --show-error --location --retry 2 "$RELEASE_ARTIFACT_URL" -o /tmp/smart-2.0.3.zip
          echo "e057ca368ec8ac1db0845c6382775a7028b603e785c1dd0e0a525daed4e7de00  /tmp/smart-2.0.3.zip" | sha256sum -c -
          mkdir -p /tmp/smart-release
          unzip -q /tmp/smart-2.0.3.zip -d /tmp/smart-release
          test "$(find /tmp/smart-release -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(node -p "require('/tmp/smart-release/build-meta.json').version")" = "2.0.3"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').releaseTag")" = "v2.0.3"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').sourceCommit")" = "21a99325e0937a0451e03dc137d35c52cd46ecbc"
      - name: Publish only compiled runtime files
        run: |
          for file in smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md; do
            test -s "/tmp/smart-release/$file"
            cp "/tmp/smart-release/$file" "./$file"
          done
          git config user.name "SmartAssignment Build Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md
          git commit -m "release: SmartAssignment 2.0.3 verified build only"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin refs/tags/v2.0.3 >/dev/null; then
            git tag -a v2.0.3 -m "SmartAssignment 2.0.3 validated build"
            git push origin refs/tags/v2.0.3
          fi
