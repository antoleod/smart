name: Import verified SmartAssignment v2.0.5 build
on:
  push:
    paths: [".github/workflows/import-smart-release-2.0.5.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate verified build
        env:
          RELEASE_ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-971c-81f4-af7a-f9fee3ffa233/raw?se=2026-11-18T12%3A34%3A46Z&sp=r&sv=2026-06-06&sr=b&scid=6b50a084-a04a-5067-b01c-6885c0d2ba97&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T06%3A34%3A08Z&ske=2026-11-19T06%3A34%3A08Z&sks=b&skv=2026-06-06&sig=TMaLjKhnC4C8c4y1ZyWAX/79qRGecgytvj%2BFd%2BxrPWs%3D"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 "$RELEASE_ARTIFACT_URL" -o /tmp/smart.zip
          echo "4b195afa62982639bd69f5884405c7fa071d1b9d3e1240a22165f229a28e9d0a  /tmp/smart.zip" | sha256sum -c -
          mkdir /tmp/smart-release
          unzip -q /tmp/smart.zip -d /tmp/smart-release
          test "$(find /tmp/smart-release -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(node -p "require('/tmp/smart-release/build-meta.json').version")" = "2.0.5"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').releaseTag")" = "v2.0.5"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').sourceCommit")" = "6ba80fa6856bbcfbec9c79863b192fa8a92e1678"
      - name: Publish public-only runtime
        run: |
          set -euo pipefail
          for file in smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md; do
            test -s "/tmp/smart-release/$file"
            cp "/tmp/smart-release/$file" "./$file"
          done
          git config user.name "SmartAssignment Build Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md
          git commit -m "release: SmartAssignment 2.0.5 verified roster persistence fix"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin refs/tags/v2.0.5 >/dev/null; then
            git tag -a v2.0.5 -m "SmartAssignment 2.0.5 validated build"
            git push origin refs/tags/v2.0.5
          fi
