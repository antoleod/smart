name: Import verified SmartAssignment v2.0.2 build
on:
  push:
    paths: [".github/workflows/import-smart-release-2.0.2.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified build-only artifact
        env:
          RELEASE_ARTIFACT_URL: "https://sdmntpreastus3.oaiusercontent.com/files/00000000-ec1c-8212-9a81-80860acc9e55/raw?se=2026-11-18T11%3A26%3A44Z&sp=r&sv=2026-06-06&sr=b&scid=edf34d06-9246-5b5f-8313-34c52db18ba1&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T08%3A34%3A18Z&ske=2026-11-19T08%3A34%3A18Z&sks=b&skv=2026-06-06&sig=w4ov/hxeAOder86MTyVf%2BRyOy7YHcu/4iFGRrIc4iiY%3D"
        run: |
          curl --fail --silent --show-error --location --retry 2 "$RELEASE_ARTIFACT_URL" -o /tmp/smart-2.0.2.zip
          echo "c5410747409326ad5e69e9a6011512dcba56f271d39f344db78927a241a78f9c  /tmp/smart-2.0.2.zip" | sha256sum -c -
          mkdir -p /tmp/smart-release
          unzip -q /tmp/smart-2.0.2.zip -d /tmp/smart-release
          test "$(find /tmp/smart-release -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(node -p "require('/tmp/smart-release/build-meta.json').version")" = "2.0.2"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').releaseTag")" = "v2.0.2"
          test "$(node -p "require('/tmp/smart-release/build-meta.json').sourceCommit")" = "462e313778eb40d149d56c58556e277e2eb876a9"
      - name: Publish only built runtime files
        run: |
          for file in smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md; do
            test -s "/tmp/smart-release/$file"
            cp "/tmp/smart-release/$file" "./$file"
          done
          git config user.name "SmartAssignment Build Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- smart-assignment.bundle.js bookmarklet.txt smart-assignment.user.js build-meta.json README.md
          git commit -m "release: SmartAssignment 2.0.2 verified build only"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin refs/tags/v2.0.2 >/dev/null; then
            git tag -a v2.0.2 -m "SmartAssignment 2.0.2 validated build"
            git push origin refs/tags/v2.0.2
          fi
